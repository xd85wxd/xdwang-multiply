<!DOCTYPE html>
<html>

<head>

<meta charset="utf-8">

<title>智能图文问答助手 V2</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f5f5;
}

.container{
    width:900px;
    margin:20px auto;
}

h1{
    text-align:center;
}

#preview{
    max-width:400px;
    max-height:300px;
    border:1px solid #ddd;
    display:none;
    margin-bottom:20px;
}

.chat-box{

    height:500px;

    background:white;

    border:1px solid #ddd;

    border-radius:10px;

    overflow-y:auto;

    padding:15px;
}

.message{

    margin:10px 0;

    display:flex;
}

.user{

    justify-content:flex-end;
}

.bot{

    justify-content:flex-start;
}

.bubble{

    max-width:70%;

    padding:12px;

    border-radius:12px;

    word-wrap:break-word;
}

.user .bubble{

    background:#4CAF50;

    color:white;
}

.bot .bubble{

    background:#e9e9e9;
}

.input-area{

    margin-top:15px;

    display:flex;

    gap:10px;
}

#question{

    flex:1;

    padding:10px;
}

button{

    width:100px;
}

</style>

</head>

<body>

<div class="container">

<h1>智能图文问答助手</h1>

<input
    type="file"
    id="image"
    accept="image/*"
>

<br><br>

<img id="preview">

<div class="chat-box" id="chatBox">

</div>

<div class="input-area">

<input
    type="text"
    id="question"
    placeholder="请输入问题..."
>

<button onclick="ask()">
发送
</button>

</div>

</div>

<script>

const imageInput =
    document.getElementById("image");

imageInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file) return;

        const preview =
            document.getElementById(
                "preview"
            );

        preview.src =
            URL.createObjectURL(file);

        preview.style.display =
            "block";
    }
);

function addMessage(text,type){

    const chatBox =
        document.getElementById(
            "chatBox"
        );

    const msg =
        document.createElement(
            "div"
        );

    msg.className =
        "message " + type;

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubble.innerText =
        text;

    msg.appendChild(
        bubble
    );

    chatBox.appendChild(
        msg
    );

    chatBox.scrollTop =
        chatBox.scrollHeight;
}

async function ask(){

    const image =
        document.getElementById(
            "image"
        ).files[0];

    const question =
        document.getElementById(
            "question"
        ).value;

    if(!image){

        alert("请上传图片");

        return;
    }

    if(!question){

        alert("请输入问题");

        return;
    }

    addMessage(
        question,
        "user"
    );

    document.getElementById(
        "question"
    ).value = "";

    addMessage(
        "正在思考...",
        "bot"
    );

    const formData =
        new FormData();

    formData.append(
        "image",
        image
    );

    formData.append(
        "question",
        question
    );

    const response =
        await fetch(
            "/ask",
            {
                method:"POST",
                body:formData
            }
        );

    const data =
        await response.json();

    const chatBox =
        document.getElementById(
            "chatBox"
        );

    chatBox.lastChild.remove();

    addMessage(
        data.answer,
        "bot"
    );
}

document
.getElementById(
    "question"
)
.addEventListener(
    "keypress",
    function(e){

        if(e.key==="Enter"){

            ask();
        }
    }
);

</script>

</body>

</html>
